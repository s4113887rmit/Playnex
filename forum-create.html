<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="Create a new discussion thread on Playnex.">
<title>Create Thread — Playnex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Style.css">
<style>
  .create-layout { max-width: 800px; margin: 0 auto; padding: 24px 40px 64px; }
  .create-header { margin-bottom: 24px; }
  .create-header h1 { font-family: var(--font-display); font-size: 28px; font-weight: 600; }
  
  .create-form { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 32px; display: flex; flex-direction: column; gap: 20px; }
  .form-group { display: flex; flex-direction: column; gap: 8px; }
  .form-group label { font-size: 13px; font-weight: 600; color: var(--text-muted); }
  
  .form-group input, .form-group select {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px;
    padding: 12px 14px; font-size: 14px; color: var(--text); font-family: var(--font-body);
  }
  
  .rich-text-editor {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px;
    min-height: 250px; padding: 12px 14px; font-size: 14px; color: var(--text);
    font-family: var(--font-body); resize: vertical;
  }
  
  .drag-drop-box {
    border: 2px dashed var(--border); border-radius: 8px; padding: 40px 20px;
    text-align: center; background: rgba(255, 255, 255, 0.02); cursor: pointer;
    transition: border-color 0.2s;
  }
  .drag-drop-box:hover { border-color: var(--accent); }
  .drag-drop-box p { font-size: 13px; color: var(--text-muted); margin-top: 8px; }
  
  .form-actions { display: flex; justify-content: flex-end; gap: 16px; margin-top: 16px; border-top: 1px solid var(--border); padding-top: 24px; }
</style>
<link rel="icon" href="/logo.png">
</head>
<body>
<a class="skip-to-content" href="#main-content">Skip to main content</a>

<header class="topbar">
  <div class="topbar__inner">
    <a href="homepage.html" class="logo">
      <img src="logo.png" alt="Playnex" class="logo__img">
    </a>
    <nav class="primary-nav">
      <a href="homepage.html" class="primary-nav__link">Home</a>
      <a href="shopping.html" class="primary-nav__link">Shopping</a>
      <a href="wishlist.html" class="primary-nav__link">Wishlist</a>
      <div class="primary-nav__dropdown">
        <a href="forum.html" class="primary-nav__link is-active">Community</a>
        <div class="primary-nav__menu">
          <a href="forum.html" class="primary-nav__sub is-active">Forum</a>
          <a href="/rating" class="primary-nav__sub">Reviews</a>
<a href="/blog" class="primary-nav__sub">Blog</a>
        </div>
      </div>
    </nav>
  </div>
<nav class="subnav">
  <a href="forum.html" class="subnav__link is-active">Forum</a>
  <a href="/rating" class="subnav__link">Reviews</a>
  <a href="/blog" class="subnav__link">Blog</a>
</nav>
</header>

<main id="main-content" class="create-layout">
  <div class="create-header">
    <h1>Create/Edit Thread</h1>
  </div>

  <form class="create-form">
    <div class="form-group">
      <label for="thread-title">Thread Title</label>
      <input type="text" id="thread-title" placeholder="Enter a descriptive title for your thread" required>
    </div>

    <div class="create-form-grid">
      <div class="form-group">
        <label for="game-selector">Game/Product Selector</label>
        <select id="game-selector">
          <option value="">Select a game or product</option>
          <option value="embercrown">Embercrown Saga</option>
          <option value="nightfall">Nightfall Protocol</option>
          <option value="merch_hoodie">Nightfall Protocol Hoodie</option>
          <option value="other">Other / General</option>
        </select>
      </div>

      <div class="form-group">
        <label for="category">Category Dropdown</label>
        <select id="category" required>
          <option value="general">General Discussion</option>
          <option value="support">Technical Support</option>
          <option value="review">Product Review</option>
          <option value="modding">Modding & Development</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="post-content">Rich Text Editor</label>
      <textarea id="post-content" class="rich-text-editor" placeholder="Type your post here. Be sure to provide enough detail for others to understand or help with your topic..."></textarea>
    </div>

    <div class="form-group">
      <label>Upload Images / Attachments</label>
      <div class="drag-drop-box">
        <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none" class="drag-drop-icon"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        <p>Image drag and drop box (or click to browse)</p>
      </div>
    </div>

    <div class="form-actions">
      <a href="forum.html" class="btn btn--ghost btn--large">Cancel</a>
      <button type="submit" class="btn btn--primary btn--large">Create / Post</button>
    </div>
  </form>
</main>
<div class="site-footer__bottom"><p>&copy; 2026 Playnex. All rights reserved.</p></div>
</footer>
<script src="public/js/header.js"></script>
<script src="public/js/forum-create.js"></script>
</body>
</html>
