<?xml version="1.0" encoding="UTF-8"?>
<!-- Hero advert: games on sale. Falling price tags and a downward price arrow. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Playnex sale price drops">
 <defs>
    <linearGradient id="saleBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b2a35"/>
      <stop offset="45%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>
    <radialGradient id="saleGlow" cx="52%" cy="36%" r="54%">
      <stop offset="0%" stop-color="#7cc4ff" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#7cc4ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7cc4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tagSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f6fc"/>
      <stop offset="55%" stop-color="#cfd8e4"/>
      <stop offset="100%" stop-color="#9aa8bd"/>
    </linearGradient>
    <linearGradient id="tagAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb454"/>
      <stop offset="100%" stop-color="#e5670a"/>
    </linearGradient>
    <linearGradient id="arrowDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3ddc97"/>
      <stop offset="100%" stop-color="#12a06a"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
 </defs>

 <rect width="600" height="800" fill="url(#saleBg)"/>
 <rect width="600" height="800" fill="url(#saleGlow)"/>

  <!-- Grid backdrop, echoing a price chart -->
 <g stroke="#7cc4ff" stroke-opacity="0.10" stroke-width="1">
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="0" y1="440" x2="600" y2="440"/>
    <line x1="0" y1="560" x2="600" y2="560"/>
    <line x1="0" y1="680" x2="600" y2="680"/>
 </g>

  <!-- Descending price line with markers, drawn under the tags -->
 <polyline points="40,300 150,268 250,352 360,330 470,470 560,560"
           fill="none" stroke="url(#arrowDown)" stroke-width="5"
           stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
 <g fill="#0b2a35" stroke="#3ddc97" stroke-width="3">
    <circle cx="150" cy="268" r="7"/>
    <circle cx="360" cy="330" r="7"/>
    <circle cx="560" cy="560" r="7"/>
 </g>

  <!-- Large hero price tag -->
 <g transform="translate(300 430) rotate(-14)" filter="url(#soft)">
    <path d="M-150 -96 L64 -96 A22 22 0 0 1 86 -74 L86 74 A22 22 0 0 1 64 96 L-150 96 A22 22 0 0 1 -172 74 L-172 -74 A22 22 0 0 1 -150 -96 Z"
          fill="url(#tagSilver)"/>
    <circle cx="-130" cy="0" r="13" fill="#0d1526"/>
    <circle cx="-130" cy="0" r="5" fill="#9aa8bd"/>
    <text x="-30" y="-18" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
          font-size="26" font-weight="bold" fill="#1b2130">ON SALE</text>
    <text x="-30" y="26" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="40" font-weight="bold" fill="#b8210f">SAVE</text>
    <text x="-30" y="62" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
          font-size="18" letter-spacing="3" fill="#5a6b82">BIG</text>
 </g>

  <!-- Small angled tags -->
 <g transform="translate(140 250) rotate(18)" filter="url(#soft)">
    <path d="M-72 -34 L34 -34 A14 14 0 0 1 48 -20 L48 20 A14 14 0 0 1 34 34 L-72 34 A14 14 0 0 1 -86 20 L-86 -20 A14 14 0 0 1 -72 -34 Z"
          fill="url(#tagAccent)"/>
    <circle cx="-64" cy="0" r="8" fill="#2b1503"/>
    <text x="-14" y="7" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
          font-size="18" font-weight="bold" fill="#2b1503">-70%</text>
 </g>

 <g transform="translate(470 200) rotate(-22)" filter="url(#soft)">
    <path d="M-62 -30 L30 -30 A12 12 0 0 1 42 -18 L42 18 A12 12 0 0 1 30 30 L-62 30 A12 12 0 0 1 -74 18 L-74 -18 A12 12 0 0 1 -62 -30 Z"
          fill="#3ddc97"/>
    <circle cx="-54" cy="0" r="7" fill="#04281a"/>
    <text x="-10" y="6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
          font-size="16" font-weight="bold" fill="#04281a">-45%</text>
 </g>

 <g transform="translate(120 640) rotate(10)" filter="url(#soft)">
    <path d="M-58 -28 L28 -28 A11 11 0 0 1 39 -17 L39 17 A11 11 0 0 1 28 28 L-58 28 A11 11 0 0 1 -69 17 L-69 -17 A11 11 0 0 1 -58 -28 Z"
          fill="#7cc4ff"/>
    <circle cx="-50" cy="0" r="6" fill="#06203a"/>
    <text x="-8" y="6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
          font-size="15" font-weight="bold" fill="#06203a">-30%</text>
 </g>

  <!-- Percentage glyphs floating as confetti -->
 <g font-family="Helvetica, Arial, sans-serif" font-weight="bold" opacity="0.55">
    <text x="64" y="140" font-size="30" fill="#cfd8e4">%</text>
    <text x="516" y="112" font-size="24" fill="#3ddc97">%</text>
    <text x="524" y="700" font-size="34" fill="#ffb454">%</text>
    <text x="70" y="446" font-size="22" fill="#7cc4ff">%</text>
 </g>
</svg>
